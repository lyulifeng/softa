# Data lives in NAMED VOLUMES on purpose: this image runs as a non-root user
# (UID 10000), and a root-created bind-mount dir is unwritable to it on any real
# Linux host (macOS Docker Desktop skips UID mapping, which is why dev never
# saw it). Docker initializes a named volume with the image's own ownership —
# no pre-created dir, no chown. Note for existing dev machines: data previously
# under ~/data/pulsar is NOT carried over.
volumes:
  pulsar_zookeeper_data:
  pulsar_bookkeeper_data:

# bash: docker network create shared-net
networks:
  shared-net:
    external: true
    name: shared-net

# json-file does not rotate by default — a long-running dev stack will fill the
# disk. Applied to every service below.
x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "5" }

services:
  # Start zookeeper
  zookeeper:
    image: apachepulsar/pulsar:4.2.1
    <<: *logging
    container_name: zookeeper
    cpus: "0.50"
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 256
    restart: on-failure
    networks:
      - shared-net
    volumes:
      # Mounted at /pulsar/data, which EXISTS in the image (owned by UID 10000):
      # a named volume only inherits ownership from paths the image actually
      # carries. Mounting a nonexistent subdir makes docker create the mountpoint
      # root-owned, and UID 10000 then fails with "Unable to create data
      # directory". zk creates its zookeeper/ subdir inside by itself.
      - pulsar_zookeeper_data:/pulsar/data
    environment:
      - metadataStoreUrl=zk:zookeeper:2181
      - PULSAR_MEM=-Xms256m -Xmx256m -XX:MaxDirectMemorySize=256m
      - PULSAR_GC=${PULSAR_GC:--XX:+UseZGC -XX:+ZGenerational -XX:+PerfDisableSharedMem -XX:+AlwaysPreTouch}
      - PULSAR_LOG_LEVEL=${PULSAR_LOG_LEVEL:-warn}
      - PULSAR_LOG_ROOT_LEVEL=${PULSAR_LOG_ROOT_LEVEL:-warn}
    command:
      - bash
      - -c
      - |
        bin/apply-config-from-env.py conf/zookeeper.conf && \
        bin/generate-zookeeper-config.sh conf/zookeeper.conf && \
        exec bin/pulsar zookeeper
    healthcheck:
      test: ["CMD", "bin/pulsar-zookeeper-ruok.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Init cluster metadata
  pulsar-init:
    container_name: pulsar-init
    hostname: pulsar-init
    image: apachepulsar/pulsar:4.2.1
    <<: *logging
    networks:
      - shared-net
    environment:
      - PULSAR_GC=${PULSAR_GC:--XX:+UseZGC -XX:+ZGenerational -XX:+PerfDisableSharedMem -XX:+AlwaysPreTouch}
      - PULSAR_LOG_LEVEL=${PULSAR_LOG_LEVEL:-warn}
      - PULSAR_LOG_ROOT_LEVEL=${PULSAR_LOG_ROOT_LEVEL:-warn}
    command:
      - bash
      - -c
      - |
        bin/pulsar initialize-cluster-metadata \
        --cluster cluster-a \
        --zookeeper zookeeper:2181 \
        --configuration-store zookeeper:2181 \
        --web-service-url http://broker:8080 \
        --broker-service-url pulsar://broker:6650
    depends_on:
      zookeeper:
        condition: service_healthy

  # Start bookie
  bookie:
    image: apachepulsar/pulsar:4.2.1
    <<: *logging
    container_name: bookie
    cpus: "1.50"
    mem_limit: 1536m
    memswap_limit: 1536m
    pids_limit: 512
    restart: on-failure
    networks:
      - shared-net
    environment:
      - clusterName=cluster-a
      - zkServers=zookeeper:2181
      - metadataServiceUri=metadata-store:zk:zookeeper:2181
      # otherwise every time we run docker compose up or down we fail to start due to Cookie
      # See: https://github.com/apache/bookkeeper/blob/405e72acf42bb1104296447ea8840d805094c787/bookkeeper-server/src/main/java/org/apache/bookkeeper/bookie/Cookie.java#L57-68
      - advertisedAddress=bookie
      - BOOKIE_MEM=-Xms768m -Xmx768m -XX:MaxDirectMemorySize=512m
      - BOOKIE_GC=${BOOKIE_GC:--XX:+UseZGC -XX:+ZGenerational -XX:+PerfDisableSharedMem -XX:+AlwaysPreTouch}
      - PULSAR_LOG_LEVEL=${PULSAR_LOG_LEVEL:-warn}
      - PULSAR_LOG_ROOT_LEVEL=${PULSAR_LOG_ROOT_LEVEL:-warn}
    depends_on:
      zookeeper:
        condition: service_healthy
      pulsar-init:
        condition: service_completed_successfully
    # Map the local directory to the container to avoid bookie startup failure due to insufficient container disks.
    volumes:
      # Same rationale as the zookeeper mount: mount the image-existing parent
      # dir; bookie creates its bookkeeper/ subdir by itself.
      - pulsar_bookkeeper_data:/pulsar/data
    command: bash -c "bin/apply-config-from-env.py conf/bookkeeper.conf && exec bin/pulsar bookie"

  # Start broker
  broker:
    image: apachepulsar/pulsar:4.2.1
    <<: *logging
    container_name: broker
    hostname: broker
    cpus: "1.5"
    mem_limit: 1792m
    memswap_limit: 1792m
    pids_limit: 512
    restart: on-failure
    networks:
      - shared-net
    environment:
      - metadataStoreUrl=zk:zookeeper:2181
      - zookeeperServers=zookeeper:2181
      - clusterName=cluster-a
      - managedLedgerDefaultEnsembleSize=1
      - managedLedgerDefaultWriteQuorum=1
      - managedLedgerDefaultAckQuorum=1
      - advertisedAddress=broker
      # Dev-only: the app runs in the IDE (a host process) and connects via
      # 127.0.0.1:6650, so lookups MUST advertise localhost. Containerized
      # deployments (e.g. hcm UAT) must NOT carry this line — advertisedListeners
      # supersedes advertisedAddress, and container clients would then get
      # "localhost" from every lookup and refuse to connect. That topology
      # advertises `broker` instead (see zingkey-hcm/deploy/docker-compose.pulsar.yml).
      - advertisedListeners=external:pulsar://localhost:6650
      - PULSAR_MEM=-Xms1024m -Xmx1024m -XX:MaxDirectMemorySize=512m
      - PULSAR_GC=${PULSAR_GC:--XX:+UseZGC -XX:+ZGenerational -XX:+PerfDisableSharedMem -XX:+AlwaysPreTouch}
      - PULSAR_LOG_LEVEL=${PULSAR_LOG_LEVEL:-warn}
      - PULSAR_LOG_ROOT_LEVEL=${PULSAR_LOG_ROOT_LEVEL:-warn}
    depends_on:
      zookeeper:
        condition: service_healthy
      bookie:
        condition: service_started
    ports:
      # Loopback-only: the IDE-hosted app reaches the broker via localhost:6650,
      # and the admin REST (8080) is for troubleshooting — both belong to this
      # machine only, never published externally.
      - "127.0.0.1:6650:6650"
      - "127.0.0.1:8080:8080"
    command: bash -c "bin/apply-config-from-env.py conf/broker.conf && exec bin/pulsar broker"
