# json-file does not rotate by default — a long-running dev stack will fill the
# disk. Applied to every service below.
x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "5" }

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    <<: *logging
    container_name: minio
    ports:
      # Loopback-only: 9000 serves the IDE-hosted app/SDK, 9001 is the console.
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - ~/data/minio:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"