spring:
  application:
    name: demo-app
  threads:
    virtual:
      enabled: true
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
      file-size-threshold: 2MB # Files larger than 2MB will be written to disk, default is 0
  cache:
    redis:
      # Global default expiration period for redis cache
      time-to-live: 30d
  jackson:
    time-zone: UTC
  jmx:
    # Turn off JVM remote calls
    enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 80
  shutdown: graceful
  servlet:
    context-path: /api/demo
  tomcat:
    max-connections: 10000
    accept-count: 600
    max-swallow-size: 20MB

cosid:
  namespace: ${spring.application.name}
  machine:
    enabled: true
    distributor:
      type: redis
  snowflake:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    db:
      enabled: false
    elasticsearch:
      enabled: false
    mail:
      enabled: false

logging:
  level:
    root: info
    org.apache.fontbox.ttf.CmapSubtable: error
    org.springframework.jdbc.core.JdbcTemplate: info

# Sentry (sentry-starter). Disabled until SENTRY_DSN is set, so this block costs
# nothing here — it is the recommended policy baseline an application should carry:
# what varies per environment (DSN, environment label, sample rates) belongs in the
# environment, what does not belongs in version control. See the starter README.
sentry:
  # Data-protection red line — never attach cookies, user IP or request bodies.
  send-default-pii: false
  # Release identifier: set it to the deployed image tag so issues map to versions.
  release: ${APP_IMAGE_TAG:}

springdoc:
  writer-with-order-by-keys: true
  api-docs:
    # Turn off in production environment
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tagsSorter: alpha
    operations-sorter: alpha
    enabled: true
